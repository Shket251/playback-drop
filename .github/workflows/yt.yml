# Смена постинга на YouTube. Идёт, даже когда домашний компьютер выключен.
#
# Два запуска в сутки по одному ролику на канал. Дома этот ритм жил в планировщике
# Windows и работал только при включённом ПК: 19.08.2026 канал @playback простоял двое
# суток с мёртвым ключом, и это выглядело как «нечего постить». Раннеры GitHub включены
# всегда.
#
# Часы разнесены намеренно. Пачка подряд читается как спам, а алгоритму нужна
# регулярность — поэтому две смены, а не одна на два ролика. Время UTC; канал смотрят
# из США, и вечер восточного побережья — это 22:00-02:00 UTC:
#
#   13:00 UTC = 16:00 МСК = 09:00 EST     утро США
#   22:30 UTC = 01:30 МСК = 18:30 EST     вечерний пик у зрителя
#
# Потолок и паузу держит сама смена (yt.py): пришедшая слишком рано уходит ни с чем.
# Расписание тут — предложение, а не приказ.
#
# Файл кладёт сюда `clipper cloud setup` — править надо в E:\Whop\cloud\yt.yml.
name: Смена YouTube

on:
  schedule:
    - cron: '0 13 * * *'
    - cron: '30 22 * * *'
  workflow_dispatch:          # кнопка «прогнать сейчас» на вкладке Actions

permissions:
  contents: write             # смена дописывает posted.json в этот же репозиторий

# Отметки у смен теперь разные (posted_yt.json против posted.json), но коммитят они
# в одну ветку — а два push подряд ловят «non-fast-forward». Замок общий со сменой
# Instagram: дешевле подождать, чем разбирать потерянную отметку.
concurrency: posting

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Опубликовать по ролику на канал
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          # По секрету на канал. Имя = YT_REFRESH_ + имя канала заглавными, всё
          # кроме букв и цифр заменено на подчёркивание (см. yt.py: secret_name).
          YT_REFRESH_PLAYBACK: ${{ secrets.YT_REFRESH_PLAYBACK }}
          YT_REFRESH_CARDCHAOS_Z6S: ${{ secrets.YT_REFRESH_CARDCHAOS_Z6S }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 yt.py

      # `if: always()` обязателен. Ролик уходит на канал РАНЬШЕ, чем пишется отметка:
      # без этого условия упавший шаг оставил бы клип опубликованным и при этом
      # «неопубликованным» — следующая смена залила бы его повторно.
      - name: Записать отметку домой
        if: always()
        run: |
          git config user.name "clipper"
          git config user.email "clipper@users.noreply.github.com"
          for f in posted_yt.json queue.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "менять нечего"
          else
            git commit -m "смена YouTube: отметки о публикации"
            git pull --rebase --autostash && git push
          fi

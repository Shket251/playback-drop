name: ping
on:
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: reach meta
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          curl -s -m 30 "https://graph.instagram.com/v23.0/me?fields=username,account_type&access_token=$IG_TOKEN" -o out.json -w 'http=%{http_code} time=%{time_total}\n'
          python3 -c "import json;d=json.load(open('out.json'));print('ОТВЕТ:', json.dumps(d, ensure_ascii=False))"

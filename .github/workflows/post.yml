# Смена постинга в облаке. Идёт, даже когда домашний компьютер выключен.
#
# Два запуска в сутки по одному клипу. Часы подобраны под зрителя: канал смотрят
# из США, и просмотры собираются в их вечер. 00:00 UTC — это 20:00 на восточном
# побережье и 03:00 в Москве; 18:00 UTC — 14:00 у них и 21:00 в Москве.
# Два поста подряд в один час алгоритм читает как спам, поэтому смены разнесены.
#
# Файл кладёт сюда `clipper cloud setup` — править надо в E:\Whop\cloud\post.yml.
name: Смена постинга

on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:          # кнопка «прогнать сейчас» на вкладке Actions

permissions:
  contents: write             # смена дописывает posted.json в этот же репозиторий

concurrency: posting          # две смены разом подрались бы за один и тот же файл

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Опубликовать один клип
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          # Смена сама убирает раздачу опубликованного клипа: держать его копию
          # в открытом репозитории до следующего включения ПК незачем.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 post.py

      # Продление идёт ДО записи домой: оно оставляет token.json с датой, и эта
      # записка должна уехать тем же коммитом. Раньше шаг стоял последним, и файл
      # оставался в машине, которую через минуту сотрут.
      #
      # Проверка «есть ли ключ» живёт внутри шага, а не в `if`: контекст secrets
      # в условиях шага недоступен, и весь файл из-за этого не принимается вовсе.
      - name: Продлить маркер доступа
        if: always()
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "нет секрета GH_PAT — маркер не продлевается, он умрёт через 60 дней"
            exit 0
          fi
          python3 post.py --refresh

      # `if: always()` обязателен. Пост уходит в ленту РАНЬШЕ, чем пишется отметка:
      # если шаг публикации завершился неудачно уже после успешного поста (или прогон
      # отменили), без этого условия шаг отметки не выполнится вовсе — клип окажется
      # в ленте и при этом «неопубликованным», а следующая смена зальёт его повторно.
      - name: Записать отметку домой
        if: always()
        run: |
          git config user.name "clipper"
          git config user.email "clipper@users.noreply.github.com"
          # Файлы добавляем ПООТДЕЛЬНОСТИ: `git add a b` при отсутствии одного из них
          # падает целиком и не добавляет НИ ОДНОГО, а `|| true` это прячет — отметка
          # потерялась бы молча, и прогон остался бы зелёным.
          for f in posted.json queue.json token.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "менять нечего"
          else
            git commit -m "смена: отметки о публикации"
            # очередь мог поменять домашний ПК прямо во время смены
            git pull --rebase --autostash && git push
          fi

# Диагностика связи: что отвечает Meta и виден ли наш сервер снаружи.
# Ничего не публикует и не меняет — можно жать в любой момент.
name: ping
on:
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: reach meta
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          curl -s -m 30 "https://graph.instagram.com/v23.0/me?fields=username,account_type&access_token=$IG_TOKEN" -w '\nmeta http=%{http_code}\n'
      - name: reach our own site from abroad
        run: |
          for u in /app /privacy /terms; do
            curl -s -m 25 -o /dev/null -w "$u -> %{http_code}\n" "https://93-95-97-85.nip.io$u" || echo "$u -> НЕ ДОСТУЧАЛИСЬ"
          done

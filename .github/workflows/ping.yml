name: ping
on:
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: reach meta
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          curl -s -m 30 "https://graph.instagram.com/v23.0/me?fields=username&access_token=$IG_TOKEN" -w '\nmeta http=%{http_code}\n'
      - name: refresh token
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "нет GH_PAT"; exit 1; fi
          python3 post.py --refresh
